<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>학생 마이페이지 - 블라썸잉글리쉬</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet" />

  <style>
    :root {
      --blue: #00AEEF;
      --mint: #9FE6B8;
      --pink: #FF6FB5;
      --bg: #f4f6fb;
      --gray: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard Variable", -apple-system, BlinkMacSystemFont,
        system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    body { background: var(--bg); padding: 30px 0 60px; }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
    }

    .top-actions {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      border-radius: 999px;
      border: none;
      padding: 8px 18px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }

    #home-btn { background: var(--mint); color: #ffffff; }
    #logout-btn { background: #e5e7eb; color: #374151; }
    #logout-btn:hover { background: #d1d5db; }

    h1.title { font-size: 32px; font-weight: 900; margin-bottom: 4px; }
    .subtitle-main { font-size: 15px; color: #6b7280; margin-bottom: 20px; }

    .section-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px 22px 22px;
      box-shadow: 0 15px 32px rgba(15, 23, 42, 0.06);
      margin-bottom: 18px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-small {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: #e5e7eb;
      color: #4b5563;
    }

    .class-hw-empty {
      padding: 16px 14px;
      border-radius: 16px;
      background: #f3f4f6;
      font-size: 14px;
      color: #6b7280;
      text-align: center;
    }

    .hw-group-card {
      background: #f9fafb;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .hw-group-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      gap: 8px;
    }

    .hw-group-date {
      font-size: 17px;
      font-weight: 900;
      color: var(--blue);
    }

    .hw-group-meta { font-size: 12px; color: #6b7280; }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin-right: 6px;
    }

    .chip-class { background: #eef2ff; color: #3730a3; }
    .chip-type { background: #ffe5f3; color: #ff6fb5; }
    .chip-online-vocab { background: #fee2e2; color: #b91c1c; }
    .chip-online-sentence { background: #e0f2fe; color: #0369a1; }
    .chip-warning { background: #fee2e2; color: #b91c1c; }

    .chip-src-teacher { background:#ede9fe; color:#5b21b6; }
    .chip-src-student { background:#ecfeff; color:#155e75; }

    .hw-text-line {
      font-size: 14px;
      color: #111827;
      font-weight: 600;
      white-space: pre-wrap;
      margin: 2px 0;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 8px;
    }

    .field { min-width: 130px; }

    .field label {
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 3px;
      display: block;
    }

    .input, .input-date {
      width: 100%;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      font-size: 13px;
      outline: none;
      background: #ffffff;
    }

    .input:focus, .input-date:focus { border-color: #2563eb; }

    .pill-group {
      display: inline-flex;
      background: #e5e7eb;
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
    }

    .pill-type-btn {
      border: none;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      background: transparent;
      color: #4b5563;
      white-space: nowrap;
      font-weight: 700;
    }

    .pill-type-btn.active {
      background: var(--blue);
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(0, 174, 239, 0.35);
    }

    .btn-primary {
      border-radius: 999px;
      border: none;
      padding: 9px 16px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      background: var(--pink);
      color: #ffffff;
      font-weight: 800;
    }

    .btn-soft {
      border-radius: 999px;
      border: none;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      background: #e5e7eb;
      color: #374151;
      font-weight: 800;
    }
    .btn-soft:hover { background: #d1d5db; }

    .btn-primary[disabled], .btn-soft[disabled] {
      opacity: 0.6;
      cursor: default;
    }

    .status-text {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 6px;
      min-height: 16px;
    }
    .status-text.error { color: #b91c1c; }

    .hint { font-size: 12px; color: #9ca3af; margin-bottom: 0; }

    .unit-result-wrap {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .unit-result-head {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.75fr 0.9fr 0.7fr 1.4fr;
      gap: 0;
      background: #f9fafb;
      color: #4b5563;
      font-weight: 800;
      font-size: 13px;
      border-bottom: 1px solid #e5e7eb;
    }

    .unit-result-head > div,
    .unit-result-summary > div {
      padding: 10px 12px;
      border-right: 1px solid #eef2f7;
    }
    .unit-result-head > div:last-child,
    .unit-result-summary > div:last-child { border-right: none; }

    .unit-row { border-bottom: 1px solid #e5e7eb; }
    .unit-row:last-child { border-bottom: none; }

    details.unit-row summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }
    details.unit-row summary::-webkit-details-marker { display: none; }

    .unit-result-summary {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.75fr 0.9fr 0.7fr 1.4fr;
      align-items: center;
      font-size: 13px;
      color: #111827;
      font-weight: 700;
    }
    .unit-result-summary:hover { background: #f9fafb; }

    .unit-result-summary > div:nth-child(1) {
      color: var(--blue);
      font-weight: 900;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 22px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }
    .status-o { background: #dcfce7; color: #166534; }
    .status-d { background: #fef3c7; color: #92400e; }
    .status-x { background: #fee2e2; color: #991b1b; }

    .unit-detail { padding: 10px 12px 12px; background: #ffffff; }

    .unit-detail-grid {
      border-radius: 14px;
      background: #f9fafb;
      padding: 10px 10px;
      display: grid;
      gap: 8px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 1fr 100px 160px;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #eef2f7;
      font-size: 13px;
    }

    .task-name { font-weight: 800; color: #111827; }
    .task-status { text-align: center; font-weight: 900; }
    .task-time { text-align: right; color: #6b7280; font-size: 12px; }

    .unit-guide { font-size: 12px; color: #6b7280; margin-top: 8px; line-height: 1.4; }

    .info-row { font-size: 14px; color: #111827; line-height: 1.7; }
    .info-row span.label { color: #6b7280; margin-right: 6px; }
    .info-message { display: none; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      width: min(820px, 100%);
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      overflow: hidden;

      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 900;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-body {
      padding: 14px 16px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .manage-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .manage-table th, .manage-table td {
      padding: 10px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: middle;
    }

    .manage-table th {
      background: #f9fafb;
      color: #4b5563;
      font-weight: 800;
    }

    .manage-date {
      color: var(--blue);
      font-weight: 900;
      white-space: nowrap;
    }

    .manage-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-mini {
      border: none;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-edit { background: #e5e7eb; color: #111827; }
    .btn-edit:hover { background: #d1d5db; }
    .btn-del { background: #fee2e2; color: #b91c1c; }
    .btn-del:hover { background: #fecaca; }

    @media (max-width: 768px) {
      .top-actions {
        position: static;
        justify-content: flex-end;
        margin-bottom: 10px;
      }
      .page { padding-top: 10px; }
      .section-card { padding: 16px 14px 18px; }

      .unit-result-head,
      .unit-result-summary {
        grid-template-columns: 1.1fr 1fr 0.8fr 0.9fr 0.7fr 1.3fr;
      }
      .task-row { grid-template-columns: 1fr 90px 130px; }

      .manage-actions { justify-content: flex-start; flex-wrap: wrap; }
    }
  </style>
</head>

<body>
<div class="page">
  <div class="top-actions">
    <button id="logout-btn" class="pill-btn" type="button">로그아웃</button>
    <button id="home-btn" class="pill-btn" type="button">Home</button>
  </div>

  <h1 class="title">학생 마이페이지</h1>
  <div class="subtitle-main">
    오늘 숙제와 온라인 학습 결과를 한 곳에서 확인해 보세요.
  </div>

  <div class="section-card">
    <div class="section-header">
      <div class="section-title">
        📚 우리 반 숙제
        <span id="class-badge" class="badge-small">-</span>
      </div>
    </div>
    <div id="class-hw-area"></div>
  </div>

  <style>
    /* ✅ 윗줄은 3칸만(버튼 제거) */
    .myhw-grid {
      display: grid;
      grid-template-columns: 160px 1fr 160px;
      gap: 10px;
      align-items: end;
      margin-bottom: 8px;
    }

    /* ✅ 아래줄: 왼쪽(구성) + 오른쪽(버튼) */
    .myhw-bottom {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      align-items: start;
      margin-top: 6px;
      margin-bottom: 6px;
    }

    .myhw-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    .btn-block { width: 100%; }

    /* 어휘 숙제 구성 */
    .vocab-config {
      display: none; /* vocab일 때만 표시 */
    }

    .preset-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .preset-btn {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .preset-btn:hover { background: #f3f4f6; }

    .mini-select-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 8px;
    }

    .mini-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 14px;
      padding: 8px 10px;
    }
    .mini-item.off { opacity: 0.55; background: #f9fafb; }
    .mini-label {
      font-size: 12px;
      font-weight: 900;
      color: #111827;
      white-space: nowrap;
    }
    .mini-select {
      margin-left: auto;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
      background: #fff;
      font-weight: 800;
      color: #111827;
      min-width: 110px;
    }

    @media (max-width: 900px) {
      .myhw-grid { grid-template-columns: 160px 1fr; }
      .myhw-bottom { grid-template-columns: 1fr; }
      .myhw-actions { flex-direction: row; }
      .btn-block { width: auto; }

      .mini-select-row { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
    }
    @media (max-width: 520px) {
      .mini-select-row { grid-template-columns: 1fr; }
      .myhw-actions { flex-direction: column; }
      .btn-block { width: 100%; }
    }
  </style>

  <div class="section-card">
    <div class="section-header">
      <div class="section-title">✍️ 내 온라인 숙제</div>
    </div>

    <style>
      .myhw-grid {
        display: grid;
        grid-template-columns: 160px 1fr 160px 160px;
        gap: 10px;
        align-items: end;
        margin-bottom: 8px;
      }

      /* ✅ 오른쪽 버튼 영역: 살짝 위로 + 세로 가운데 정렬 느낌 */
      .myhw-actions-wrap {
        align-self: center;
      }

      .myhw-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;
        align-items: flex-end; /* 기본은 오른쪽 정렬 */
      }

      .btn-block { width: 100%; }

      .vocab-config {
        margin: 6px 0 10px;
        display: none; /* vocab일 때만 표시 */
      }

      .preset-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        flex-wrap: wrap;
      }

      .preset-btn {
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #374151;
        font-size: 11px;
        font-weight: 800;
        padding: 5px 10px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
      }
      .preset-btn:hover { background: #f3f4f6; }

      .mini-select-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(160px, 1fr));
        gap: 8px;
      }

      .mini-item {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #e5e7eb;
        background: #fff;
        border-radius: 14px;
        padding: 8px 10px;
      }
      .mini-item.off { opacity: 0.55; background: #f9fafb; }

      .mini-label {
        font-size: 12px;
        font-weight: 900;
        color: #111827;
        white-space: nowrap;
      }

      .mini-select {
        margin-left: auto;
        border: 1px solid #d1d5db;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        outline: none;
        background: #fff;
        font-weight: 800;
        color: #111827;
        min-width: 110px;
      }

      @media (max-width: 900px) {
        .myhw-grid { grid-template-columns: 160px 1fr; }
        .myhw-actions-wrap { grid-column: 1 / -1; }
        .myhw-actions { flex-direction: row; }
        .btn-block { width: auto; }
        .mini-select-row { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
      }

      @media (max-width: 520px) {
        .mini-select-row { grid-template-columns: 1fr; }
        .myhw-actions { flex-direction: column; }
        .btn-block { width: 100%; }
      }

      /* ===== ✅ 버튼 3개 최종 정리 (요청사항 반영) ===== */

      /* 1) 버튼 크기 통일 */
      #my-hw-save-btn,
      #my-hw-manage-btn,
      #my-hw-cancel-btn {
        width: 130px;
      }

      /* 2) 버튼 순서: 등록 → 관리 → 취소 */
      #my-hw-save-btn   { order: 1; }
      #my-hw-manage-btn { order: 2; }
      #my-hw-cancel-btn { order: 3; }

      /* 🌸 숙제 등록 (핑크 버튼) */
      #my-hw-save-btn {
        background: var(--pink);
        color: #ffffff;
        border: none;

        /* 좌우, 상하 미세 조정 */
        transform: translate(-30px, 35px);
      }

      /* 🌿 숙제 관리 (민트 버튼) */
      #my-hw-manage-btn {
        background: var(--mint);
        color: #ffffff;
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;

        /* 좌우, 상하 미세 조정 */
        transform: translate(-30px, 35px);
      }
    </style>

    <div class="myhw-grid">
      <div class="field" style="min-width:150px;">
        <label>숙제 종류</label>
        <div class="pill-group">
          <button type="button" id="type-vocab" class="pill-type-btn active">어휘</button>
          <button type="button" id="type-sentence" class="pill-type-btn">문장</button>
        </div>
      </div>

      <div class="field" style="min-width:180px;">
        <label>단계-세트 (예: 1-1 또는 잠신중1-1)</label>
        <input id="my-hw-set" class="input" type="text" placeholder="예: 1-1 또는 1-1, 1-2 또는 잠신중1-1" />
      </div>

      <div class="field" style="min-width:150px;">
        <label>마감일</label>
        <input id="my-hw-due" class="input-date" type="date" />
      </div>

      <div class="field myhw-actions-wrap" style="min-width:190px;">
        <label>&nbsp;</label>
        <div class="myhw-actions">
          <button id="my-hw-save-btn" class="btn-primary btn-block" type="button">숙제 등록</button>
          <button id="my-hw-manage-btn" class="btn-soft btn-block" type="button">숙제 관리</button>
          <button id="my-hw-cancel-btn" class="btn-soft btn-block" type="button" style="display:none;">수정 취소</button>
        </div>
      </div>
    </div>

    <div id="vocab-config" class="vocab-config">
      <div class="preset-row">
        <button type="button" id="preset-default" class="preset-btn">기본 4종</button>
        <button type="button" id="preset-blank3" class="preset-btn">문장 빈칸 ×3</button>
        <button type="button" id="preset-reset" class="preset-btn">초기화</button>
      </div>

      <div class="mini-select-row">
        <div class="mini-item" id="mini-meaning">
          <div class="mini-label">뜻 찾기</div>
          <select id="sel-meaning" class="mini-select">
            <option value="0">0</option><option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option><option value="5">5</option>
          </select>
        </div>

        <div class="mini-item" id="mini-english">
          <div class="mini-label">영어 찾기</div>
          <select id="sel-english" class="mini-select">
            <option value="0">0</option><option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option><option value="5">5</option>
          </select>
        </div>

        <div class="mini-item" id="mini-listening">
          <div class="mini-label">듣고 찾기</div>

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function formatTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `${hh}:${mm}`;
  }
  function toDateKey(iso) { return formatDate(iso); }

  function dateKeyFromTitle(title) {
    if (!title) return "";
    const trimmed = title.trim();
    const m = trimmed.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return "";
  }

  function parseUnitKeysFromSetNumbers(setNumbers) {
    if (!setNumbers) return [];
    return String(setNumbers).split(",").map(s => s.trim()).filter(Boolean).map(s => s.replace(/\s+/g, ""));
  }

  function safeLatestBySubmittedAt(arr) {
    const list = (arr || []).filter(x => x && x.submitted_at);
    if (!list.length) return null;
    return list.sort((a,b) => new Date(b.submitted_at) - new Date(a.submitted_at))[0];
  }

  function scoreTextFromResult(r) {
    if (!r) return "--";
    const total = Number(r.total_count || 0);
    const correct = Number(r.correct_count || 0);
    if (!total) return "--";
    const score = Math.round((correct / total) * 100);
    return `${score}점`;
  }

  function isValidSentenceUnitKey(text) {
    const t = String(text || "").trim();
    if (/^\d+\s*-\s*\d+$/.test(t)) return true;
    if (/^(잠신중|잠신고)\s*\d+\s*-\s*\d+$/.test(t)) return true;
    return false;
  }

  function parseSetsForSave(setStr, type) {
    const parts = String(setStr || "").split(",").map(s => s.trim()).filter(Boolean);
    if (!parts.length) return null;

    if (type === "vocab") {
      const first = parts[0].split("-");
      if (first.length !== 2) return null;
      const baseLevel = Number(first[0]);
      if (!baseLevel) return null;

      for (const p of parts) {
        const [lvStr, setNumStr] = p.split("-");
        const lv = Number(lvStr);
        const sn = Number(setNumStr);
        if (!lv || !sn || lv !== baseLevel) return null;
      }
      return { level: baseLevel, raw: parts.join(", ") };
    }

    for (const p of parts) if (!isValidSentenceUnitKey(p)) return null;

    let level = 0;
    const m = parts[0].match(/^(\d+)\s*-\s*\d+$/);
    if (m) level = Number(m[1]) || 0;

    const normalized = parts.map(p => p.replace(/\s+/g, ""));
    return { level, raw: normalized.join(", ") };
  }

  function clampNum(v, min, max) {
    const n = Number(v);
    if (Number.isNaN(n)) return min;
    return Math.max(min, Math.min(max, n));
  }

function normalizeAndExpandHomeworkRows(row, from) {
  const isStudent = from === "student";
  const type = isStudent ? row.type : (from === "teacher_sentence" ? "sentence" : "vocab");

  let tasks = row.tasks;

  if (!tasks && type === "vocab") {
    if (row.count_meaning !== undefined || row.count_english !== undefined) {
      tasks = {
        meaning: row.count_meaning || 0,
        english: row.count_english || 0,
        listening: row.count_listening || 0,
        sentence: row.count_sentence || 0
      };
    } else {
      tasks = { meaning: 1, english: 1, listening: 1, sentence: 1 };
    }
  }

  let level = row.level;
  if (!level && row.set_numbers) {
    const match = String(row.set_numbers).match(/^(\d+)/);
    if (match) level = parseInt(match[1], 10);
  }

  const unitKeys = parseUnitKeysFromSetNumbers(row.set_numbers);

  if (unitKeys.length === 0) {
    return [{
      source: isStudent ? "student" : "teacher",
      sourceLabel: isStudent ? "내가 등록" : "선생님",
      type,
      due_date: row.due_date || null,
      created_at: row.created_at || null,
      unit_key: null,
      unit_text: (row.set_numbers || "-"),
      tasks, 
      raw: row
    }];
  }

  return unitKeys.map(uk => ({
    source: isStudent ? "student" : "teacher",
    sourceLabel: isStudent ? "내가 등록" : "선생님",
    type,
    due_date: row.due_date || null,
    created_at: row.created_at || null,
    unit_key: uk,
    unit_text: uk,
    tasks, 
    raw: row
  }));
}

  function taskCell(result) {
    if (!result) return { mark: "❌", color: "#991b1b", time: "--" };
    const total = Number(result.total_count || 0);
    const correct = Number(result.correct_count || 0);
    const ok = total > 0 && correct >= total;
    return {
      mark: ok ? "⭕" : "△",
      color: ok ? "#166534" : "#92400e",
      time: result.submitted_at ? `${formatDate(result.submitted_at)} ${formatTime(result.submitted_at)}` : "--"
    };
  }

  function taskCellByCount({ doneCount, required, latest }) {
    if (!required || required <= 0) return { mark: "-", color: "#9ca3af", time: "--", progress: "" };

    const done = Number(doneCount || 0);
    const req = Number(required || 0);

    if (done <= 0) return { mark: "❌", color: "#991b1b", time: "--", progress: `${done}/${req}` };

    if (done < req) {
      return {
        mark: "△",
        color: "#92400e",
        time: latest?.submitted_at ? `${formatDate(latest.submitted_at)} ${formatTime(latest.submitted_at)}` : "--",
        progress: `${done}/${req}`
      };
    }

    return {
      mark: "⭕",
      color: "#166534",
      time: latest?.submitted_at ? `${formatDate(latest.submitted_at)} ${formatTime(latest.submitted_at)}` : "--",
      progress: `${done}/${req}`
    };
  }

  function computeOverallStatusFromVocabModes(modeMap, tasks) {
    if (!tasks) return { cls: "status-x", text: "❌" };

    const modes = ["meaning", "english", "listening", "sentence"];
    const requiredModes = modes.filter(m => Number(tasks[m] || 0) > 0);

    if (requiredModes.length === 0) return { cls: "status-x", text: "❌" };

    let completed = 0;
    requiredModes.forEach(m => {
      const required = Number(tasks[m]);
      const done = Number(modeMap?.[m]?.doneCount || 0);
      if (done >= required) completed++;
    });

    if (completed === 0) return { cls: "status-x", text: "❌" };
    if (completed === requiredModes.length) return { cls: "status-o", text: "⭕" };
    return { cls: "status-d", text: "△" };
  }

  const SENTENCE_TASKS_NORMAL = [
    { mode: "blank",   label: "빈칸 완성" },
    { mode: "arrange", label: "문장 배열" }
  ];
  const SENTENCE_TASKS_SCHOOL = [
    { mode: "school1", label: "학교 시험 1" },
    { mode: "school2", label: "학교 시험 2" },
    { mode: "school3", label: "학교 시험 3" },
    { mode: "school4", label: "학교 시험 4" },
    { mode: "school5", label: "학교 시험 5" }
  ];
  function isSchoolUnitKey(unitKey) {
    const t = String(unitKey || "");
    return /^(잠신중|잠신고)\d+-\d+$/.test(t);
  }

  function buildSentenceTaskView(unitKey, sentenceByUnitByMode) {
    const modeMap = (sentenceByUnitByMode && sentenceByUnitByMode[unitKey]) ? sentenceByUnitByMode[unitKey] : {};
    const tasks = isSchoolUnitKey(unitKey) ? SENTENCE_TASKS_SCHOOL : SENTENCE_TASKS_NORMAL;

    const rows = tasks.map(t => {
      const pack = modeMap ? modeMap[t.mode] : null;          // {doneCount, latest}
      const latest = pack?.latest || null;
      const cell = taskCell(latest);                          
      const hasAny = (pack?.doneCount || 0) > 0;
      return { ...t, pack, hasAny, cell };
    });

    const doneCount = rows.filter(x => x.hasAny).length;
    const totalCount = rows.length;

    const overall = (doneCount === 0)
      ? { cls: "status-x", text: "❌" }
      : (doneCount === totalCount)
        ? { cls: "status-o", text: "⭕" }
        : { cls: "status-d", text: "△" };

    const latest = safeLatestBySubmittedAt(rows.map(r => r.pack?.latest).filter(Boolean));
    const submittedText = latest
      ? `${scoreTextFromResult(latest)} · ${formatDate(latest.submitted_at)} ${formatTime(latest.submitted_at)}`
      : "--";

    return { rows, overall, submittedText };
  }

  async function buildResultMap(table, unitKeys) {
    const resultMap = {};
    if (!unitKeys || unitKeys.length === 0) return resultMap;

    const { data, error } = await client
      .from(table)
      .select("id, student_login_id, unit_key, mode, correct_count, total_count, submitted_at")
      .eq("student_login_id", currentStudent.login_id)
      .in("unit_key", unitKeys)
      .order("submitted_at", { ascending: false });

    if (error) throw error;

    (data || []).forEach(r => {
      const uk = r.unit_key;
      if (!uk) return;
      if (!resultMap[uk]) resultMap[uk] = [];
      resultMap[uk].push(r);
    });

    return resultMap;
  }

  function calcStats(rawList, sinceDate, requirements, usedSet) {
    const stats = {}; 
    if (!rawList) return stats;

    const since = sinceDate ? new Date(sinceDate) : new Date(0);

    const candidates = rawList.filter(r => {
      if (new Date(r.submitted_at) <= since) return false;
      if (usedSet.has(r.id)) return false;
      return true;
    });

    candidates.sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at));

    candidates.forEach(r => {
      const md = r.mode || "unknown";
      
      if (!stats[md]) {
        stats[md] = { doneCount: 0, latest: null };
      }

      const limit = requirements ? (requirements[md] || 0) : 9999;
      
      if (stats[md].doneCount < limit) {
        stats[md].doneCount += 1;
        usedSet.add(r.id); 

        const cur = stats[md].latest;
        if (!cur || new Date(r.submitted_at) > new Date(cur.submitted_at)) {
          stats[md].latest = r;
        }
      }
    });

    return stats;
  }

async function loadUnifiedHomeworkResults() {
  if (!currentStudent || !currentStudent.login_id) return;
  
  unitResultBody.innerHTML = '<div class="class-hw-empty">결과를 불러오는 중...</div>';

  try {
    const studentReq = client.from("student_homework")
      .select("id, type, level, set_numbers, due_date, created_at, tasks")
      .eq("student_login_id", currentStudent.login_id);

    let teacherVocabReq = Promise.resolve({ data: [], error: null });
    let teacherSentenceReq = Promise.resolve({ data: [], error: null });

    if (currentClass && currentClass.id) {
      teacherVocabReq = client.from("vocab_homework")
        .select("*") 
        .eq("class_id", currentClass.id);

      teacherSentenceReq = client.from("sentence_homework")
        .select("*")
        .eq("class_id", currentClass.id);
    }

    const [studentRes, tvRes, tsRes] = await Promise.all([
      studentReq,
      teacherVocabReq,
      teacherSentenceReq
    ]);

    if (studentRes.error) throw studentRes.error;
    if (tvRes.error) throw tvRes.error;
    if (tsRes.error) throw tsRes.error;

    const items = []
      .concat((studentRes.data || []).flatMap(r => normalizeAndExpandHomeworkRows(r, "student")))
      .concat((tvRes.data || []).flatMap(r => normalizeAndExpandHomeworkRows(r, "teacher_vocab")))
      .concat((tsRes.data || []).flatMap(r => normalizeAndExpandHomeworkRows(r, "teacher_sentence")));

    items.sort((a, b) => {
      const ad = a.due_date ? new Date(a.due_date).getTime() : Number.POSITIVE_INFINITY;
      const bd = b.due_date ? new Date(b.due_date).getTime() : Number.POSITIVE_INFINITY;
      if (ad !== bd) return ad - bd;
      const at = a.created_at ? new Date(a.created_at).getTime() : 0;
      const bt = b.created_at ? new Date(b.created_at).getTime() : 0;
      return at - bt;
    });

    if (!items.length) {
      renderUnifiedResults([], {}, {});
      return;
    }

    const vocabUnitKeys = Array.from(new Set(
      items.filter(x => x.type === "vocab" && x.unit_key).map(x => x.unit_key)
    ));
    const sentenceUnitKeys = Array.from(new Set(
      items.filter(x => x.type === "sentence" && x.unit_key).map(x => x.unit_key)
    ));

    const vocabByUnitByMode = await buildResultMap("vocab_results", vocabUnitKeys);
    const sentenceByUnitByMode = await buildResultMap("sentence_results", sentenceUnitKeys);

    renderUnifiedResults(items, vocabByUnitByMode, sentenceByUnitByMode);

  } catch (e) {
    console.error("통합 결과 로딩 오류:", e);
    unitResultBody.innerHTML = '<div class="class-hw-empty">결과를 불러오는 중 오류가 발생했어요.</div>';
  }
}

    presetResetBtn.addEventListener("click", setVocabTasksReset);
